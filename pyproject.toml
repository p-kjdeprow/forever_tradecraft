[project]
name = "crowley"
version = "0.1.0"
description = "Auction house data platform and addon for WoW Forever"
readme = "README.md"
authors = [
    { name = "Kyle DeProw", email = "kydepro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pillow>=11.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crowley-server = "crowley.server.__main__:main"
crowley-companion = "crowley.companion.__main__:main"
crowley-watchlist = "crowley.core.watchlist:main"
crowley-scan = "crowley.scan.cli:main"
crowley-ops = "crowley.ops.cli:main"
crowley-trading = "crowley.trading.__main__:main"
crowley-paper-step = "crowley.ops.paper_step:main"
crowley-native = "crowley.native.build:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowley"]

[tool.hatch.build.targets.wheel.force-include]
"deploy/templates/host.example.toml" = "crowley/ops/package_data/config/host.example.toml"

[tool.hatch.build.targets.sdist]
include = ["src/**", "addon/**", "deploy/**", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
# Preserve the mapped package resources when a wheel is built from the sdist.
"addon" = "src/crowley/ops/package_data/addon"
"deploy/systemd" = "src/crowley/ops/package_data/systemd"
"deploy/launcher" = "src/crowley/ops/package_data/launcher"
"deploy/config" = "src/crowley/ops/package_data/config"
"deploy/docker" = "src/crowley/ops/package_data/docker"
"deploy/.env.example" = "src/crowley/ops/package_data/secrets.env.example"

[dependency-groups]
dev = [
    "lupa>=2.8",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "16", "--dist", "worksteal"]
tmp_path_retention_policy = "failed"
markers = [
    "native: tests requiring native helper binaries or native client contracts",
    "process: tests that spawn or inspect external processes",
    "x11: tests requiring an X11 display or input backend",
    "db: tests requiring a database connection",
    "slow: tests that are intentionally slower than the default unit-test path",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src/crowley"]
exclude = ["tests", ".archive"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = [
    "src/crowley/config",
    "src/crowley/platform",
    "src/crowley/domain",
    "src/crowley/store",
    "src/crowley/core/auction_rules.py",
]
