[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "crowley-market"
version = "0.2.0"
description = "Crowley market ingestion, analysis, API, and recovery tools"
requires-python = ">=3.12"
dependencies = [
  "crowley-common>=0.2,<0.3",
  "fastapi>=0.143.1",
  "pydantic>=2.14.1,<3",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic-settings>=2.16.0",
  "starlette>=1.8.0",
  "uvicorn[standard]>=0.54.0",
  "scipy>=1.16,<2",
]

[project.scripts]
crowley-server = "crowley_market.server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crowley_market"]
artifacts = [
  "src/crowley_market/server/migrations/*.sql",
  "src/crowley_market/server/static/trading-dashboard.html",
  "src/crowley_market/server/static/merchant-favor.html",
  "src/crowley_market/resources/merchant_favor.json",
  "src/crowley_market/resources/merchant_writs.json",
  "src/crowley_market/resources/docker-compose.yml",
  "src/crowley_market/py.typed",
]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "src/crowley_market"]
