name: crowley

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowley
      POSTGRES_PASSWORD: ${CROWLEY_DB_PASSWORD:?set CROWLEY_DB_PASSWORD in secrets.env}
      POSTGRES_DB: crowley
    volumes:
      - crowley-db:/var/lib/postgresql/data
    ports:
      # Localhost only; the API is the only thing exposed over Tailscale.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowley -d crowley"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: crowley-server:${CROWLEY_IMAGE_VERSION:?set CROWLEY_IMAGE_VERSION in secrets.env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${XDG_CONFIG_HOME:?set XDG_CONFIG_HOME}/crowley/secrets.env
    environment:
      CROWLEY_DATABASE_URL: postgresql://crowley:${CROWLEY_DB_PASSWORD:?set CROWLEY_DB_PASSWORD in secrets.env}@db:5432/crowley
      CROWLEY_API_TOKEN: ${CROWLEY_API_TOKEN:?set CROWLEY_API_TOKEN in secrets.env}
      CROWLEY_DATA_DIR: /data
      CROWLEY_HOST: 0.0.0.0
      CROWLEY_PORT: "8080"
    volumes:
      - crowley-raw:/data
    ports:
      - "${CROWLEY_BIND:?set CROWLEY_BIND in secrets.env}:8080:8080"

volumes:
  crowley-db:
  crowley-raw:
