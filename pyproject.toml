[project]
name = "crowley-host"
version = "0.2.0"
description = "Crowley host composition and installation tools"
readme = "README.md"
authors = [
    { name = "Kyle DeProw", email = "kydepro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crowley-automation>=0.2,<0.3",
    "crowley-common>=0.2,<0.3",
    "crowley-market>=0.2,<0.3",
    "crowley-scanner>=0.2,<0.3",
    "pydantic>=2.14.1,<3",
]

[project.scripts]
crowley-host = "crowley_host.scan.cli:main"
crowley-ops = "crowley_host.ops.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/host/src/crowley_host"]
artifacts = ["apps/host/src/crowley_host/ops/package_data/**/*"]

[tool.hatch.build.targets.sdist]
include = ["apps/host/src/**", "pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "lupa>=2.8",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = ["packages/common", "packages/market", "packages/scanner", "packages/automation"]

[tool.uv.sources]
crowley-automation = { workspace = true }
crowley-common = { workspace = true }
crowley-market = { workspace = true }
crowley-scanner = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "16", "--dist", "worksteal"]
tmp_path_retention_policy = "failed"
markers = [
    "native: tests requiring native helper binaries or native client contracts",
    "process: tests that spawn or inspect external processes",
    "x11: tests requiring an X11 display or input backend",
    "db: tests requiring a database connection",
    "slow: tests that are intentionally slower than the default unit-test path",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = [
    "apps/host/src/crowley_host",
    "packages/common/src/crowley_common",
    "packages/market/src/crowley_market",
    "packages/scanner/src/crowley_scanner",
    "packages/automation/src/crowley_automation",
]
exclude = ["tests", ".archive"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = [
    "apps/host/src/crowley_host/config",
    "packages/common/src/crowley_common/platform",
    "packages/market/src/crowley_market/store",
    "packages/common/src/crowley_common/auction_rules.py",
]
