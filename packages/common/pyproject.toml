[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "crowley-common"
version = "0.2.0"
description = "Shared Crowley contracts, target data, and private filesystem helpers"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.1,<3"]

[project.scripts]
crowley-watchlist = "crowley_common.watchlist:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crowley_common"]
artifacts = ["src/crowley_common/data/**/*.json", "src/crowley_common/data/targets/selected", "src/crowley_common/py.typed"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "src/crowley_common"]
